<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydro-Agent | 智慧水庫防汛與清淤調度平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-300 font-sans antialiased selection:bg-sky-500/30">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 md:px-12 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <span class="text-sky-400 text-2xl">🌊</span>
            <h1 class="text-xl md:text-2xl font-bold text-white tracking-wider">Hydro-Agent</h1>
        </div>
        <nav class="hidden md:flex gap-6">
            <a href="#" class="text-slate-400 hover:text-white transition-colors">系統介紹</a>
            <a href="#" class="text-slate-400 hover:text-white transition-colors">數位孿生展示</a>
            <a href="#" class="text-slate-400 hover:text-white transition-colors">聯絡維運單位</a>
        </nav>
        <div>
            <button class="bg-slate-700 hover:bg-slate-600 border border-slate-500 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                工程師登入
            </button>
        </div>
    </header>

    <main class="flex flex-col items-center justify-center min-h-[80vh] px-6 text-center relative overflow-hidden">
        
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-sky-500/20 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="relative z-10">
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-bold mb-6 inline-block">
                系統狀態：全區感測器正常連線
            </span>
            <h2 class="text-4xl md:text-6xl font-extrabold text-white mb-6 leading-tight">
                新世代<span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500">智慧水庫</span><br/>防汛與調度平台
            </h2>
            <p class="text-lg text-slate-400 max-w-2xl mx-auto mb-10 leading-relaxed">
                整合 IoT 現地感知、Edge AI 邊緣運算與 3D 數位孿生技術，提供零延遲的異重流排砂決策與全自動化清淤船隊巡航調度。
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button class="bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 px-8 rounded-xl shadow-[0_0_20px_rgba(56,189,248,0.3)] transition-all hover:scale-105">
                    進入中控儀表板
                </button>
                <button class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3 px-8 rounded-xl transition-all hover:scale-105">
                    檢視歷史時序分析
                </button>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 Hydro-Agent 系統. 版權所有.</p>
    </footer>

</body>
</html>
